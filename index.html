:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#f6f7fa;background:#070e1b;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 95% 0%,rgba(2,82,176,.25),transparent 34%),radial-gradient(circle at -10% 90%,rgba(252,109,15,.13),transparent 32%),#070e1b}button,input,select{font:inherit}button{cursor:pointer;color:inherit}button:disabled{opacity:.5;cursor:not-allowed}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #ff9b3d;outline-offset:2px}.shell{max-width:1600px;margin:0 auto;min-height:100vh;padding:0 30px 132px}.topbar{height:86px;border:1px solid rgba(255,255,255,.1);border-top:0;border-radius:0 0 28px 28px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 26px;background:linear-gradient(110deg,rgba(35,39,61,.72),rgba(6,18,36,.83));box-shadow:0 12px 40px #0005;backdrop-filter:blur(16px)}.identity{display:flex;align-items:center;gap:13px;min-width:195px}.mark{font-size:37px;font-weight:950;font-style:italic;color:#ff8615;filter:drop-shadow(0 4px 8px #ff8a224f);line-height:1}.brand{font-weight:850;font-size:22px;letter-spacing:-.8px;line-height:1}.brand-sub{color:#ff931f;font-size:16px;font-weight:800}.tinytag{border:1px solid #ff942866;color:#ffbd80;font-size:8px;border-radius:4px;padding:2px 5px;margin-left:4px;vertical-align:middle;letter-spacing:.5px}.restaurant{display:flex;align-items:center;gap:11px}.restaurant b{display:block;font-size:15px}.restaurant small{color:#9fb2c6}.store-emoji{font-size:28px;color:#ff8517}.top-actions{display:flex;align-items:center;gap:12px}.tag{display:inline-flex;gap:8px;align-items:center;white-space:nowrap;border-radius:100px;padding:8px 13px;font-size:12px;border:1px solid #31415b;background:rgba(8,24,47,.75)}.tag-neutral{color:#9cb0c9}.tag-success{color:#77e3b8;border-color:#206c51;background:#0c322ba8}.avatar{background:#394971;border:1px solid #7384af;width:3 der-color:#4087b5}.tile-icon{font-size:30px;line-height:1.25;color:#ffa552}.tile strong{font-size:20px}.tile span:not(.tile-icon){color:#c1cad6;font-size:13px}.stat{padding:21px;min-height:118px}.stat-label{color:#abb9ca;font-size:13px}.stat-number{margin-top:10px;font-size:27px;font-weight:800;letter-spacing:-.7px}.stat-footer{font-size:12px;color:#73dfa8;margin-top:5px}.statuslist{display:grid;gap:13px}.status-row{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #3a4d6655;padding:9px 0;gap:12px}.status-row:last-child{border-bottom:0}.linechart{height:90px;border-bottom:1px solid #455b78;position:relative;margin-top:13px;background:linear-gradient(to top,#f78a1c2b,transparent);border-radius:13px;overflow:hidden}.linechart svg{width:100%;height:100%}.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:max(17px,env(safe-area-inset-bottom));width:min(1450px,calc(100% - 40px));z-index:30;background:linear-gradient(115deg,rgba(34,40,60,.93),rgba(10,22,41,.94));backdrop-filter:blur(22px);border:1px solid #43536a;border-bottom-color:#cf722e;border-radius:29px;display:flex;align-items:stretch;gap:4px;padding:8px;box-shadow:0 12px 50px #000b,0 2px 14px #f6721c21}.dock-btn{flex:1;min-width:0;border:1px solid transparent;background:transparent;color:#d9e0ea;border-radius:22px;display:flex;align-items:center;flex-direction:column;justify-content:center;gap:4px;font-size:11px;padding:11px 5px;white-space:nowrap}.dock-btn.active{background:linear-gradient(135deg,#ffa125,#e96608);border:1px solid #ffad4a;color:white;box-shadow:0 0 18px #f77a284c}.dock-icon{font-size:21px;line-height:1.1}.tablemap{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;background:radial-gradient(circle at center,#293246,#121d30);border:1px solid #364d65;border-radius:20px;padding:24px}.tablebtn{min-height:110px;border-radius:18px;border:1px solid #355e5d;background:linear-gradient(145deg,#164d40,#112b2c);text-align:center;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px}.tablebtn.occupied{background:linear-gradient(140deg,#673a32,#35212a);border-color:#cb654f}.tablebtn.reserved{background:linear-gradient(140deg,#204e7a,#192e47);border-color:#4b9add}.tablebtn.selected{outline:3px solid #ffa146;outline-offset:2px}.tablebtn b{font-size:17px}.tablebtn small{font-size:11px;opacity:.8}.pill{padding:7px 12px;background:#213049;border:1px solid #415773;border-radius:100px;color:#d7e2ef;font-size:12px}.pill.green{color:#8af1b9;background:#13382a;border-color:#2a7950}.pill.orange{color:#ffc590;background:#49321f;border-color:#915a2d}.pill.blue{color:#8bc8ff;background:#15344f;border-color:#2a608b}.pill.red{color:#ff9a9c;background:#42232c;border-color:#824254}.orderboard{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.orderboard .card{padding:17px}.ticket{background:linear-gradient(145deg,#202d43,#111a2c);border:1px solid #42536a;border-radius:16px;padding:16px;margin-top:13px}.ticket b{font-size:15px}.ticket-item{font-size:13px;margin:10px 0;color:#d6dfe7}.ticket-actions{display:flex;gap:8px;flex-wrap:wrap}.ticket .btn{padding:8px 10px;font-size:12px}.divider{height:1px;background:#3b4b60;margin:15px 0}.products{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}.product{background:#172237;border:1px solid #354866;border-radius:17px;padding:14px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;min-height:140px;text-align:left}.product .emoji{font-size:27px}.product b{font-size:13px}.product .price{color:#ffc07a;font-weight:700;font-size:13px}.cashitem{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid #3e4c6155}.qty{display:inline-flex;align-items:center;gap:10px}.qty button{background:#22324d;border:1px solid #3d5270;border-radius:10px;padding:4px 9px}.total{display:flex;justify-content:space-between;align-items:center;padding:15px 0;font-size:23px;font-weight:800;color:#ffad4e}.input,select{width:100%;background:#142238;border:1px solid #3c506d;border-radius:12px;color:#f8fafc;padding:12px 14px;outline:0}.input::placeholder{color:#879db5}.field{display:grid;gap:7px;font-size:12px;color:#b7c5d3}.fields{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.table-scroll{overflow:auto;max-width:100%}.datatable{width:100%;border-collapse:collapse;min-width:670px}.datatable th{text-align:left;color:#91a6bf;font-weight:600;font-size:12px;padding:13px;border-bottom:1px solid #45546a}.datatable td{padding:13px;border-bottom:1px solid #37465c88;font-size:13px}.datatable tr:last-child td{border-bottom:0}.filters{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:16px}.filter{border:1px solid #45536c;background:#182840;padding:9px 15px;border-radius:100px;font-size:12px}.filter.selected{background:#f5790a;border-color:#ffa34e}.value-row{display:flex;justify-content:space-between;gap:14px;align-items:center}.meter{height:9px;border-radius:100px;background:#354258;overflow:hidden;flex:1}.meter i{display:block;height:100%;background:linear-gradient(90deg,#fa7c12,#ffbb5b)}.bar-list{display:grid;gap:16px}.banner{background:linear-gradient(110deg,#1d3048,#182438);border:1px solid #315577;border-radius:19px;padding:18px;margin-top:16px}.label-line{display:flex;justify-content:space-between;align-items:center;gap:12px}.toast{position:fixed;bottom:125px;right:26px;border:1px solid #e2924e;background:#38291d;color:white;border-radius:13px;padding:13px 17px;box-shadow:0 10px 40px #0009;opacity:0;pointer-events:none;transition:opacity .2s;max-width:320px;z-index:90;font-size:13px}.toast.show{opacity:1}@media(max-width:1120px){.grid-4{grid-template-columns:repeat(2,minmax(0,1fr))}.top-actions .tag-neutral{display:none}.split,.split-wide{grid-template-columns:1fr}.orderboard{grid-template-columns:repeat(2,minmax(0,1fr))}.products{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:760px){.shell{padding:0 12px 115px}.topbar{padding:0 13px;height:72px;border-radius:0 0 18px 18px}.identity{min-width:auto}.mark{font-size:32px}.brand{font-size:19px}.brand-sub{font-size:13px}.restaurant{display:none}.top-actions{gap:6px}.top-actions .tag-success{display:none}.avatar{width:31px;height:31px}.workspace{padding-top:23px}.heading{display:block}.heading .stack{margin-top:14px}.card{padding:16px;border-radius:19px}.tile{min-height:132px;padding:18px}.tile strong{font-size:17px}.grid{gap:11px}.orderboard{grid-template-columns:1fr}.products{grid-template-columns:repeat(2,minmax(0,1fr))}.tablemap{grid-template-columns:repeat(3,minmax(0,1fr));padding:13px;gap:9px}.tablebtn{min-height:87px}.fields{grid-template-columns:1fr}.dock{width:calc(100% - 14px);border-radius:22px;overflow:auto;gap:0;justify-content:flex-start;padding:6px}.dock-btn{min-width:73px;font-size:10px;padding:9px 4px}.dock-icon{font-size:19px}.toast{right:12px;bottom:100px}.stat-number{font-size:24px}}@media(max-width:390px){.tablemap{grid-template-columns:repeat(2,minmax(0,1fr))}.grid-4{grid-template-columns:repeat(2,minmax(0,1fr))}.tile{padding:13px;min-height:124px}}

<body>
  <div class="shell">
    <header class="topbar">
      <div class="identity"><span class="mark">D</span><div><div class="brand">Dvolada</div><div class="brand-sub">Local <span class="tinytag">DEMO QA</span></div></div></div>
      <div class="restaurant"><span class="store-emoji">▣</span><div><b>Restaurante Demo</b><small>Operación presencial</small></div></div>
      <div class="top-actions"><span class="tag tag-neutral" id="sync-status">↻ Plus sin conectar</span><span class="tag tag-success">● Local activo</span><span class="avatar">D</span></div>
    </header>
    <main class="workspace" id="workspace" aria-live="polite"></main>
    <nav class="dock" aria-label="Navegación principal" id="dock"></nav>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>
  <script>
// Dvolada Local interactive PROTOTYPE. All data is fictitious and stored on this device only.
const STORE='dvolada-local-demo-v1';
const menu=[['home','⌂','Inicio'],['tables','◫','Mesas'],['orders','▤','Pedidos'],['pos','▣','Caja (POS)'],['kitchen','♨','Cocina (KDS)'],['inventory','◈','Inventario'],['reports','▥','Reportes'],['staff','♙','Personal'],['settings','⚙','Configuración']];
const sample=()=>({
  tables:Array.from({length:12},(_,i)=>({id:`M${i+1}`,status:i===1||i===5?'occupied':i===2?'reserved':'free',capacity:i===3?6:4})),
  products:[{id:'p1',name:'Hamburguesa clásica',category:'Comidas',price:14500,icon:'🍔',stock:18},{id:'p2',name:'Baleada especial',category:'Comidas',price:6000,icon:'🫓',stock:30},{id:'p3',name:'Pizza personal',category:'Comidas',price:16000,icon:'🍕',stock:12},{id:'p4',name:'Tacos de pollo',category:'Comidas',price:12000,icon:'🌮',stock:25},{id:'p5',name:'Papas grandes',category:'Extras',price:5500,icon:'🍟',stock:10},{id:'p6',name:'Refresco',category:'Bebidas',price:3500,icon:'🥤',stock:35},{id:'p7',name:'Café',category:'Bebidas',price:4500,icon:'☕',stock:15},{id:'p8',name:'Combo Dvolada',category:'Combos',price:22000,icon:'🍽️',stock:8}],
  orders:[{id:'L-001',origin:'local',table:'M2',items:[{productId:'p1',name:'Hamburguesa clásica',qty:2,price:14500}],status:'preparing',created:Date.now()-8*60000},{id:'L-002',origin:'local',table:'M6',items:[{productId:'p3',name:'Pizza personal',qty:1,price:16000}],status:'new',created:Date.now()-3*60000}],
  cart:[],selectedTable:'M1',activeShift:true,opening:5000,sales:[],staff:[{id:'u1',name:'Administrador demo',role:'Administrador',status:'Activo'},{id:'u2',name:'Cajero de prueba',role:'Caja',status:'Activo'},{id:'u3',name:'Personal de cocina',role:'Cocina',status:'Activo'}],
  selectedCategory:'Todos',filter:'Todos',mode:'local',active:'home'
});
let state;
try{state=JSON.parse(localStorage.getItem(STORE)||'null')||sample()}catch{state=sample()}
const el=document.getElementById('workspace'),dock=document.getElementById('dock');
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const price=c=>`L ${(Number(c)/100).toLocaleString('es-HN',{minimumFractionDigits:2,maximumFractionDigits:2})}`;
const total=items=>items.reduce((a,i)=>a+i.qty*i.price,0);
const statusName={new:'Nuevo',preparing:'En preparación',ready:'Listo',delivered:'Entregado',cancelled:'Cancelado'};
const statusPill=s=>`<span class="pill ${s==='ready'||s==='delivered'?'green':s==='preparing'?'orange':'blue'}">${statusName[s]||esc(s)}</span>`;
const head=(title,subtitle,actions='')=>`<div class="heading"><div><div class="eyebrow">Dvolada Local · Prototipo interactivo</div><h1>${title}</h1><p>${subtitle}</p></div><div class="stack">${actions}</div></div>`;
const btn=(label,action,extra='',cl='btn')=>`<button class="${cl}" data-action="${action}" ${extra}>${label}</button>`;
const tile=(ico,title,sub,action,style='')=>`<button class="tile ${style}" data-action="navigate" data-to="${action}"><span class="tile-icon">${ico}</span><strong>${title}</strong><span>${sub}</span></button>`;
function save(){try{localStorage.setItem(STORE,JSON.stringify(state))}catch{/* Navegadores que bloquean almacenamiento en archivos locales: demo temporal */}}
let timer;
function toast(message){const x=document.getElementById('toast');x.textContent=message;x.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>x.classList.remove('show'),3000)}
function render(){save();dock.innerHTML=menu.map(([id,ico,label])=>`<button data-action="navigate" data-to="${id}" class="dock-btn ${state.active===id?'active':''}" title="${label}" aria-current="${state.active===id?'page':'false'}"><span class="dock-icon">${ico}</span><span>${label}</span></button>`).join('');
  const views={home,tables,orders,pos,kitchen,inventory,reports,staff,settings};el.innerHTML=(views[state.active]||home)();document.getElementById('sync-status').textContent='↻ Plus aún sin conectar';}
function home(){const sales=state.sales.reduce((a,i)=>a+i.amount,0),active=state.orders.filter(o=>o.status!=='delivered'&&o.status!=='cancelled').length,occupied=state.tables.filter(t=>t.status==='occupied').length;
 return head('Buen día 👋','Un inicio limpio para controlar la operación de tu restaurante.',btn('Restaurar demo','reset','', 'btn btn-subtle'))+
 `<div class="grid grid-4">${tile('▣','Caja (POS)','Ventas y cobros','pos','orange')}${tile('◫','Mesas',`${state.tables.length} mesas configuradas`,'tables','blue')}${tile('▤','Pedidos',`${active} pedidos activos`,'orders')}${tile('♨','Cocina (KDS)','Comandas del local','kitchen')}</div>
 <div class="split" style="margin-top:18px"><section class="card"><h2 class="card-title">◫ Resumen de la demostración</h2><div class="grid grid-3"><div><div class="stat-label">Ventas registradas</div><div class="stat-number">${price(sales)}</div></div><div><div class="stat-label">Pedidos</div><div class="stat-number">${state.orders.length}</div></div><div><div class="stat-label">Mesas ocupadas</div><div class="stat-number">${occupied} / ${state.tables.length}</div></div></div><div class="linechart"><svg viewBox="0 0 450 90" preserveAspectRatio="none"><path d="M0 75 C50 73 65 29 110 52 S175 75 225 39 S290 55 335 19 S420 40 450 8" fill="none" stroke="#ff8a22" stroke-width="3.5"/></svg></div><p class="muted tiny">Gráfico ilustrativo; no representa ventas reales.</p></section>
 <section class="card"><div class="label-line"><h2 class="card-title">Estado operativo</h2><span class="pill green">● Local activo</span></div><div class="statuslist"><div class="status-row"><span>Mesas</span><b>${occupied} ocupadas</b></div><div class="status-row"><span>Cocina</span><b>${state.orders.filter(o=>o.status==='preparing').length} en preparación</b></div><div class="status-row"><span>Caja</span><b class="${state.activeShift?'success':'warning'}">${state.activeShift?'Abierta (demo)':'Cerrada'}</b></div><div class="status-row"><span>Dvolada Online</span><span class="warning">Sin enlazar</span></div></div><div class="banner"><b>♧ Preparado para Plus</b><p class="muted small">Al contratar Plus, este mismo programa podrá mostrar pedidos online mediante una API segura; actualmente no hay sincronización real.</p>${btn('Ver futura conexión','navigate','data-to="settings"','btn btn-subtle')}</div></section></div>`;}
function tables(){const t=state.tables.find(t=>t.id===state.selectedTable)||state.tables[0];return head('Mesas','Salón interactivo para pedidos presenciales y reservas.',btn('Nueva orden en caja','navigate','data-to="pos"','btn btn-primary'))+
 `<div class="split split-wide"><div class="card"><div class="label-line"><h2 class="card-title">Plano del salón</h2><span class="pill">${state.tables.length} mesas</span></div><div class="tablemap">${state.tables.map(x=>`<button class="tablebtn ${x.status==='occupied'?'occupied':x.status==='reserved'?'reserved':''} ${t.id===x.id?'selected':''}" data-action="select-table" data-id="${x.id}"><b>${x.id}</b><small>${x.status==='free'?'Libre':x.status==='occupied'?'Ocupada':'Reservada'}</small><small>${x.capacity} personas</small></button>`).join('')}</div><div class="filters" style="margin-top:18px"><span class="pill green">● Libres: ${state.tables.filter(x=>x.status==='free').length}</span><span class="pill red">● Ocupadas: ${state.tables.filter(x=>x.status==='occupied').length}</span><span class="pill blue">● Reservadas: ${state.tables.filter(x=>x.status==='reserved').length}</span></div></div>
 <div class="card"><h2 class="card-title">${t.id} · ${t.status==='free'?'Libre':t.status==='occupied'?'Ocupada':'Reservada'}</h2><p class="muted">Capacidad de ${t.capacity} personas</p><div class="divider"></div><h3 class="small">Cuenta de la mesa</h3>${state.orders.filter(o=>o.table===t.id&&o.status!=='cancelled').map(o=>`<div class="status-row"><span>${esc(o.id)} · ${statusName[o.status]}</span><strong>${price(total(o.items))}</strong></div>`).join('')||'<p class="muted small">Sin pedidos asociados.</p>'}<div class="divider"></div><div class="stack">${btn('Agregar pedido','table-order','','btn btn-primary')}${btn(t.status==='reserved'?'Liberar reserva':t.status==='free'?'Reservar':'Liberar mesa','toggle-table')}</div><p class="muted tiny">Operaciones ficticias guardadas únicamente en este navegador.</p></div></div>`;}
function pos(){const subtotal=total(state.cart);const chosen=state.tables.find(t=>t.id===state.selectedTable);return head('Caja (POS)','Venta presencial y para llevar; precios de demostración.',btn(state.activeShift?'Cerrar caja demo':'Abrir caja demo','shift','',state.activeShift?'btn':'btn btn-primary'))+
 `<div class="split split-wide"><div class="card"><div class="label-line"><h2 class="card-title">Catálogo</h2><span class="pill">${state.products.length} productos</span></div><div class="filters">${['Todos','Comidas','Bebidas','Extras','Combos'].map(cat=>`<button class="filter ${state.selectedCategory===cat?'selected':''}" data-action="category" data-category="${cat}">${cat}</button>`).join('')}</div><div class="products">${state.products.filter(p=>state.selectedCategory==='Todos'||p.category===state.selectedCategory).map(p=>`<button class="product" data-action="add-item" data-id="${p.id}" ${p.stock<=0?'disabled':''}><span class="emoji">${p.icon}</span><b>${esc(p.name)}</b><span class="value-row"><span class="price">${price(p.price)}</span><span class="pill">${p.stock>0?'+':'Agotado'}</span></span></button>`).join('')}</div></div>
 <div class="card"><div class="label-line"><h2 class="card-title">Venta actual</h2><span class="pill">${state.cart.reduce((a,i)=>a+i.qty,0)} artículos</span></div><div class="fields"><label class="field">Destino<select id="pos-dest"><option value="table">Mesa</option><option value="takeaway">Para llevar</option></select></label><label class="field">Mesa<select id="pos-table">${state.tables.map(t=>`<option value="${t.id}" ${t.id===state.selectedTable?'selected':''}>${t.id} · ${t.status==='free'?'Libre':t.status==='occupied'?'Ocupada':'Reservada'}</option>`).join('')}</select></label></div><div class="divider"></div>${state.cart.length?state.cart.map(i=>`<div class="cashitem"><div><b class="small">${esc(i.name)}</b><div class="muted tiny">${price(i.price)} c/u</div></div><div class="qty"><button data-action="change-qty" data-id="${i.id}" data-delta="-1">−</button><b>${i.qty}</b><button data-action="change-qty" data-id="${i.id}" data-delta="1">+</button></div><b class="small">${price(i.qty*i.price)}</b></div>`).join(''):'<p class="muted">Agregá productos para comenzar.</p>'}<div class="divider"></div><div class="value-row"><span class="muted">Subtotal</span><b>${price(subtotal)}</b></div><div class="total"><span>Total</span><span>${price(subtotal)}</span></div>${btn('Registrar venta de prueba','checkout',state.cart.length&&state.activeShift?'':'disabled','btn btn-primary')}<p class="muted tiny">Sin cobro real ni emisión de facturas fiscales. La comanda pasa a Cocina.</p></div></div>`;}
function orders(){const list=state.orders.filter(o=>state.filter==='Todos'||o.status===state.filter||o.origin===state.filter);return head('Pedidos','Pedidos locales y, cuando exista integración autorizada, pedidos Online.',btn('Nueva orden','navigate','data-to="pos"','btn btn-primary'))+
 `<div class="grid grid-4">${[['Todos','Todos'],['local','Presenciales'],['online','Online'],['delivered','Entregados']].map(([id,name])=>`<button class="tile ${state.filter===id?'orange':''}" style="min-height:98px" data-action="order-filter" data-id="${id}"><strong>${name}</strong><span>${state.orders.filter(o=>id==='Todos'||o.origin===id||o.status===id).length} pedidos</span></button>`).join('')}</div><section class="card" style="margin-top:17px"><h2 class="card-title">Listado de órdenes</h2><div class="table-scroll"><table class="datatable"><thead><tr><th>Pedido</th><th>Origen</th><th>Mesa</th><th>Estado</th><th>Total</th><th>Acción</th></tr></thead><tbody>${list.map(o=>`<tr><td><strong>${esc(o.id)}</strong></td><td>${o.origin==='local'?'Presencial':o.origin==='takeaway'?'Para llevar':'Online'}</td><td>${esc(o.table||'—')}</td><td>${statusPill(o.status)}</td><td>${price(total(o.items))}</td><td>${o.status==='delivered'?'✓ Completado':btn('Avanzar','next-order',`data-id="${o.id}" ${o.status==='cancelled'?'disabled':''}`)}</td></tr>`).join('')||'<tr><td colspan="6">No hay pedidos con este filtro.</td></tr>'}</tbody></table></div></section>`;}
function kitchen(){const columns=[['new','Pendientes'],['preparing','Preparando'],['ready','Listos']];return head('Cocina (KDS)','Comandas separadas por estado, sin datos privados ni importes.',btn('Ver todos los pedidos','navigate','data-to="orders"'))+
 `<div class="orderboard">${columns.map(([status,name])=>`<section class="card"><div class="label-line"><h2 class="card-title">${name}</h2><span class="pill ${status==='ready'?'green':status==='preparing'?'orange':'blue'}">${state.orders.filter(o=>o.status===status).length}</span></div>${state.orders.filter(o=>o.status===status).map(o=>`<div class="ticket"><div class="label-line"><b>${esc(o.id)}</b><span class="pill">${esc(o.table||'Para llevar')}</span></div>${o.items.map(i=>`<div class="ticket-item">${i.qty} × ${esc(i.name)}</div>`).join('')}<div class="ticket-actions">${btn(status==='new'?'Preparar':status==='preparing'?'Marcar listo':'Entregar','next-order',`data-id="${o.id}"`,'btn btn-primary')}</div></div>`).join('')||'<p class="muted small">No hay comandas en esta columna.</p>'}</section>`).join('')}</div><div class="banner"><b>Integración Plus prevista</b><p class="muted small">Los pedidos Online podrán aparecer en la misma cocina cuando se haya verificado la licencia, la API y el conector; ningún pedido online real está conectado todavía.</p></div>`;}
function inventory(){return head('Inventario','Productos e insumos del local, con alertas de existencias.',btn('Nueva entrada de prueba','stock-add-one','','btn btn-primary'))+
 `<div class="grid grid-4">${[['Productos',state.products.length],['Unidades',state.products.reduce((a,p)=>a+p.stock,0)],['Stock bajo',state.products.filter(p=>p.stock<12).length],['En catálogo',state.products.filter(p=>p.stock>0).length]].map(([n,v])=>`<div class="card stat"><div class="stat-label">${n}</div><div class="stat-number">${v}</div></div>`).join('')}</div><section class="card" style="margin-top:17px"><h2 class="card-title">Existencias</h2><div class="table-scroll"><table class="datatable"><thead><tr><th>Producto</th><th>Categoría</th><th>Existencia</th><th>Estado</th><th>Acción</th></tr></thead><tbody>${state.products.map(p=>`<tr><td>${p.icon} ${esc(p.name)}</td><td>${p.category}</td><td>${p.stock}</td><td><span class="pill ${p.stock<12?'orange':'green'}">${p.stock<12?'Reabastecer':'Óptimo'}</span></td><td>${btn('+ Entrada','stock-add',`data-id="${p.id}"`)}</td></tr>`).join('')}</tbody></table></div></section><div class="banner"><b>Sincronización Plus</b><p class="small muted">El inventario Local será independiente; antes de compartir disponibilidad con Online se definirán reglas de stock y autoridad para impedir vender productos agotados.</p></div>`;}
function reports(){const income=state.sales.reduce((a,x)=>a+x.amount,0),count=state.sales.length;const byItem=new Map();for(const o of state.orders)for(const i of o.items)byItem.set(i.name,(byItem.get(i.name)||0)+i.qty);const sorted=[...byItem].sort((a,b)=>b[1]-a[1]);return head('Reportes','Indicadores de ejemplo; separación de ventas locales y online.')+
 `<div class="grid grid-4"><div class="card stat"><div class="stat-label">Ventas registradas</div><div class="stat-number">${price(income)}</div></div><div class="card stat"><div class="stat-label">Tickets cobrados</div><div class="stat-number">${count}</div></div><div class="card stat"><div class="stat-label">Ticket promedio</div><div class="stat-number">${price(count?Math.round(income/count):0)}</div></div><div class="card stat"><div class="stat-label">Pedidos online</div><div class="stat-number">0</div><div class="muted tiny">No conectado</div></div></div><div class="split" style="margin-top:17px"><div class="card"><h2 class="card-title">Productos más solicitados</h2><div class="bar-list">${sorted.map(([name,count])=>`<div class="value-row"><span class="small">${esc(name)}</span><div class="meter"><i style="width:${100*count/Math.max(1,sorted[0][1])}%"></i></div><b>${count}</b></div>`).join('')||'<p class="muted">Sin ventas registradas.</p>'}</div></div><div class="card"><h2 class="card-title">Ventas por canal</h2><div class="statuslist"><div class="status-row"><span>Local presencial</span><b>${price(income)}</b></div><div class="status-row"><span>Online (Dvolada)</span><span class="warning">No conectado</span></div><div class="status-row"><span>Más funciones financieras</span><span class="muted">Pendiente de backend</span></div></div></div></div>`;}
function staff(){return head('Personal','Roles separados para caja, mesas, cocina y administración.')+
 `<div class="grid grid-3">${[['Usuarios',state.staff.length],['Activos',state.staff.filter(x=>x.status==='Activo').length],['Roles disponibles',5]].map(([k,v])=>`<div class="card stat"><div class="stat-label">${k}</div><div class="stat-number">${v}</div></div>`).join('')}</div><section class="card" style="margin-top:17px"><h2 class="card-title">Personal de prueba</h2><div class="table-scroll"><table class="datatable"><thead><tr><th>Nombre</th><th>Rol</th><th>Estado</th><th>Permisos</th></tr></thead><tbody>${state.staff.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.role)}</td><td><span class="pill green">${esc(u.status)}</span></td><td>${u.role==='Cocina'?'Solo comandas':u.role==='Caja'?'Caja y cobro':'Administración demo'}</td></tr>`).join('')}</tbody></table></div><p class="muted tiny">La creación y revocación de usuarios reales requiere autenticación comercial del servidor; esta demo no habilita accesos.</p></section>`;}
function settings(){return head('Configuración','Parámetros del local y futura integración con Dvolada Online.',btn('Restaurar demo','reset','', 'btn btn-subtle'))+
 `<div class="split"><div class="card"><h2 class="card-title">Datos del restaurante</h2><div class="fields"><label class="field">Nombre<input class="input" value="Restaurante Demo" disabled /></label><label class="field">Plan actual<input class="input" value="Local · Demostración" disabled /></label><label class="field">Moneda<input class="input" value="Lempira (HNL)" disabled /></label><label class="field">Modo<select><option>Oscuro</option></select></label></div><div class="divider"></div><p class="small muted">Estas opciones son visuales; los ajustes reales se protegerán por permisos del propietario.</p></div><div class="card"><div class="label-line"><h2 class="card-title">↻ Dvolada Plus</h2><span class="pill orange">No activado</span></div><p class="muted small">La conexión estará disponible únicamente con una licencia Plus válida y un vínculo autorizado entre restaurantes.</p><div class="statuslist"><div class="status-row"><span>Licencia Plus verificada</span><b class="warning">Pendiente</b></div><div class="status-row"><span>API Online autorizada</span><b class="warning">Pendiente</b></div><div class="status-row"><span>Productos y precios</span><b>Sin sincronizar</b></div><div class="status-row"><span>Pedidos Online</span><b>Sin conexión</b></div></div><div class="divider"></div>${btn('Conectar Plus (próximamente)','disabled-plus','disabled','btn btn-primary')}<p class="tiny muted">No se usan contraseñas ni tokens de Dvolada Online en este navegador.</p></div></div>`;}
function act(action,target){const id=target.dataset.id;switch(action){case 'navigate':state.active=target.dataset.to;break;
 case 'reset':if(!confirm('¿Restaurar los datos ficticios de esta demo?'))return;state=sample();break;
 case 'select-table':state.selectedTable=id;break;
 case 'toggle-table':{const t=state.tables.find(t=>t.id===state.selectedTable);if(!t)return;t.status=t.status==='reserved'?'free':t.status==='free'?'reserved':'free';break}
 case 'table-order':state.active='pos';break;
 case 'category':state.selectedCategory=target.dataset.category;break;
 case 'add-item':{const p=state.products.find(p=>p.id===id);if(!p||p.stock<=0)return;let item=state.cart.find(i=>i.id===id);if(item)item.qty++;else state.cart.push({id:p.id,name:p.name,price:p.price,qty:1});toast(`${p.name} agregado`);break}
 case 'change-qty':{const i=state.cart.find(x=>x.id===id);if(!i)return;i.qty+=Number(target.dataset.delta);if(i.qty<=0)state.cart=state.cart.filter(x=>x.id!==id);break}
 case 'checkout':{if(!state.activeShift){toast('Abrí caja antes de registrar');return}if(!state.cart.length)return;for(const i of state.cart){const p=state.products.find(p=>p.id===i.id);if(!p||p.stock<i.qty){toast(`Stock insuficiente: ${i.name}`);return}}const dest=document.getElementById('pos-dest')?.value;const table=dest==='takeaway'?null:document.getElementById('pos-table')?.value;const order={id:'L-'+String(Date.now()).slice(-6),origin:dest==='takeaway'?'takeaway':'local',table,items:state.cart.map(i=>({...i})),created:Date.now(),status:'new'};state.orders.unshift(order);for(const i of state.cart)state.products.find(p=>p.id===i.id).stock-=i.qty;if(table){state.tables.find(t=>t.id===table).status='occupied';state.selectedTable=table;}state.sales.push({id:'S-'+order.id,orderId:order.id,amount:total(order.items),date:Date.now()});state.cart=[];state.active='kitchen';toast('Venta demo creada y enviada a Cocina');break}
 case 'shift':state.activeShift=!state.activeShift;toast(state.activeShift?'Caja demo abierta':'Caja demo cerrada');break;
 case 'order-filter':state.filter=id;break;
 case 'next-order':{const o=state.orders.find(x=>x.id===id);if(!o)return;const next={new:'preparing',preparing:'ready',ready:'delivered'}[o.status];if(next){o.status=next;if(next==='delivered'&&o.table){const pending=state.orders.some(x=>x.id!==id&&x.table===o.table&&x.status!=='delivered'&&x.status!=='cancelled');if(!pending)state.tables.find(t=>t.id===o.table).status='free'}toast(`Pedido ${o.id}: ${statusName[next]}`)}break}
 case 'stock-add-one':state.products[0].stock+=5;toast('Entrada ficticia registrada');break;
 case 'stock-add':state.products.find(x=>x.id===id).stock+=5;toast('Se añadieron 5 unidades de prueba');break;
 case 'disabled-plus':toast('Plus estará disponible tras conectar la API y verificar la licencia');break;
 default:return;
}render()}
document.addEventListener('click',event=>{const target=event.target.closest('[data-action]');if(target&&!target.disabled)act(target.dataset.action,target)});

render();

  </script>
</body>
