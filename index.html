/* Salón real: croquis cargado y mesas colocadas sobre el plano */
.floor-scroll{overflow:auto;border-radius:19px;border:1px solid rgba(255,151,67,.25);background:#0b1728;overscroll-behavior-x:contain}

.floor-stage.is-editing{cursor:crosshair;outline:2px dashed #ff9e42;outline-offset:-7px}.floor-stage.has-plan:before{border:1px dashed #ffad6b66;box-shadow:inset 0 0 45px #07101b70}

.floor-table.square .table-core{border-radius:11px;transform:rotate(-4deg)}.floor-table .table-core small{font-size:8px;opacity:.9;font-weight:650}

.floor-table .seat.s1{top:0;left:32px}.floor-table .seat.s2{bottom:0;left:32px}.floor-table .seat.s3{left:-2px;top:38px;transform:rotate(90deg)}.floor-table .seat.s4{right:-2px;top:38px;transform:rotate(90deg)}

 `<div class="grid grid-4">${[['Todos','Todos'],['local','Presenciales'],['online','Online'],['delivered','Entregados']].map(([id,name])=>`<button class="tile ${state.filter===id?'orange':''}" style="min-height:98px" data-action="order-filter" data-id="${id}"><strong>${name}</strong><span>${state.orders.filter(o=>id==='Todos'||o.origin===id||o.status===id).length} pedidos</span></button>`).join('')}</div><section class="card" style="margin-top:17px"><h2 class="card-title">Listado de órdenes</h2><div class="table-scroll"><table class="datatable"><thead><tr><th>Pedido</th><th>Origen</th><th>Mesa</th><th>Estado</th><th>Total</th><th>Acción</th></tr></thead><tbody>${list.map(o=>`<tr><td><strong>${esc(o.id)}</strong></td><td>${o.origin==='local'?'Presencial':o.origin==='takeaway'?'Para llevar':'Online'}</td><td>${esc(o.table||'—')}</td><td>${statusPill(o.status)}</td><td>${price(total(o.items))}</td><td>${o.status==='delivered'?'✓ Completado':btn('Avanzar','next-order',`data-id="${o.id}" ${o.status==='cancelled'?'disabled':''}`)}</td></tr>`).join('')||'<tr><td colspan="6">No hay pedidos con este filtro.</td></tr>'}</tbody></table></div></section>`;}

function inventory(){return head('Inventario','Productos e insumos del local, con alertas de existencias.',btn('Nueva entrada de prueba','stock-add-one','','btn btn-primary'))+
 `<div class="grid grid-4">${[['Productos',state.products.length],['Unidades',state.products.reduce((a,p)=>a+p.stock,0)],['Stock bajo',state.products.filter(p=>p.stock<12).length],['En catálogo',state.products.filter(p=>p.stock>0).length]].map(([n,v])=>`<div class="card stat"><div class="stat-label">${n}</div><div class="stat-number">${v}</div></div>`).join('')}</div><section class="card" style="margin-top:17px"><h2 class="card-title">Existencias</h2><div class="table-scroll"><table class="datatable"><thead><tr><th>Producto</th><th>Categoría</th><th>Existencia</th><th>Estado</th><th>Acción</th></tr></thead><tbody>${state.products.map(p=>`<tr><td>${p.icon} ${esc(p.name)}</td><td>${p.category}</td><td>${p.stock}</td><td><span class="pill ${p.stock<12?'orange':'green'}">${p.stock<12?'Reabastecer':'Óptimo'}</span></td><td>${btn('+ Entrada','stock-add',`data-id="${p.id}"`)}</td></tr>`).join('')}</tbody></table></div></section><div class="banner"><b>Sincronización Plus</b><p class="small muted">El inventario Local será independiente; antes de compartir disponibilidad con Online se definirán reglas de stock y autoridad para impedir vender productos agotados.</p></div>`;}
function reports(){const income=state.sales.reduce((a,x)=>a+x.amount,0),count=state.sales.length;const byItem=new Map();for(const o of state.orders)for(const i of o.items)byItem.set(i.name,(byItem.get(i.name)||0)+i.qty);const sorted=[...byItem].sort((a,b)=>b[1]-a[1]);return head('Reportes','Indicadores de ejemplo; separación de ventas locales y online.')+
 `<div class="grid grid-4"><div class="card stat"><div class="stat-label">Ventas registradas</div><div class="stat-number">${price(income)}</div></div><div class="card stat"><div class="stat-label">Tickets cobrados</div><div class="stat-number">${count}</div></div><div class="card stat"><div class="stat-label">Ticket promedio</div><div class="stat-number">${price(count?Math.round(income/count):0)}</div></div><div class="card stat"><div class="stat-label">Pedidos online</div><div class="stat-number">0</div><div class="muted tiny">No conectado</div></div></div><div class="split" style="margin-top:17px"><div class="card"><h2 class="card-title">Productos más solicitados</h2><div class="bar-list">${sorted.map(([name,count])=>`<div class="value-row"><span class="small">${esc(name)}</span><div class="meter"><i style="width:${100*count/Math.max(1,sorted[0][1])}%"></i></div><b>${count}</b></div>`).join('')||'<p class="muted">Sin ventas registradas.</p>'}</div></div><div class="card"><h2 class="card-title">Ventas por canal</h2><div class="statuslist"><div class="status-row"><span>Local presencial</span><b>${price(income)}</b></div><div class="status-row"><span>Online (Dvolada)</span><span class="warning">No conectado</span></div><div class="status-row"><span>Más funciones financieras</span><span class="muted">Pendiente de backend</span></div></div></div></div>`;}

function act(action,target){const id=target.dataset.id;switch(action){case 'navigate':state.active=target.dataset.to;break;
 case 'reset':if(!confirm('¿Restaurar los datos ficticios de esta demo?'))return;state=sample();break;
 case 'select-table':state.selectedTable=id;break;
 case 'toggle-table':{const t=state.tables.find(t=>t.id===state.selectedTable);if(!t)return;t.status=t.status==='reserved'?'free':t.status==='free'?'reserved':'free';break}
 case 'table-order':state.active='pos';break;
 case 'category':state.selectedCategory=target.dataset.category;break;
 case 'add-item':{const p=state.products.find(p=>p.id===id);if(!p||p.stock<=0)return;let item=state.cart.find(i=>i.id===id);if(item)item.qty++;else state.cart.push({id:p.id,name:p.name,price:p.price,qty:1});toast(`${p.name} agregado`);break}
 case 'change-qty':{const i=state.cart.find(x=>x.id===id);if(!i)return;i.qty+=Number(target.dataset.delta);if(i.qty<=0)state.cart=state.cart.filter(x=>x.id!==id);break}
 case 'checkout':{if(!state.activeShift){toast('Abrí caja antes de registrar');return}if(!state.cart.length)return;for(const i of state.cart){const p=state.products.find(p=>p.id===i.id);if(!p||p.stock<i.qty){toast(`Stock insuficiente: ${i.name}`);return}}const dest=document.getElementById('pos-dest')?.value;const table=dest==='takeaway'?null:document.getElementById('pos-table')?.value;const order={id:'L-'+String(Date.now()).slice(-6),origin:dest==='takeaway'?'takeaway':'local',table,items:state.cart.map(i=>({...i})),created:Date.now(),status:'new'};state.orders.unshift(order);for(const i of state.cart)state.products.find(p=>p.id===i.id).stock-=i.qty;if(table){state.tables.find(t=>t.id===table).status='occupied';state.selectedTable=table;}state.sales.push({id:'S-'+order.id,orderId:order.id,amount:total(order.items),date:Date.now()});state.cart=[];state.active='kitchen';toast('Venta demo creada y enviada a Cocina');break}
 case 'shift':state.activeShift=!state.activeShift;toast(state.activeShift?'Caja demo abierta':'Caja demo cerrada');break;
 case 'order-filter':state.filter=id;break;
 case 'next-order':{const o=state.orders.find(x=>x.id===id);if(!o)return;const next={new:'preparing',preparing:'ready',ready:'delivered'}[o.status];if(next){o.status=next;if(next==='delivered'&&o.table){const pending=state.orders.some(x=>x.id!==id&&x.table===o.table&&x.status!=='delivered'&&x.status!=='cancelled');if(!pending)state.tables.find(t=>t.id===o.table).status='free'}toast(`Pedido ${o.id}: ${statusName[next]}`)}break}
 case 'stock-add-one':state.products[0].stock+=5;toast('Entrada ficticia registrada');break;
 case 'stock-add':state.products.find(x=>x.id===id).stock+=5;toast('Se añadieron 5 unidades de prueba');break;
 case 'disabled-plus':toast('Plus estará disponible tras conectar la API y verificar la licencia');break;
 default:return;
}render()}
document.addEventListener('click',event=>{const target=event.target.closest('[data-action]');if(target&&!target.disabled)act(target.dataset.action,target)});

}

 legacyRenderLocal();
 const actions=el.querySelector('.heading .stack');
 if(actions)actions.insertAdjacentHTML('beforeend',`<button class="btn btn-subtle focus-control" data-action="focus-panel" title="${panelFocusMode?'Salir de pantalla completa':'Ampliar únicamente este panel'}" aria-label="${panelFocusMode?'Volver a vista normal':'Ampliar panel'}"><span>${panelFocusMode?'⊟':'⛶'}</span>${panelFocusMode?'Vista normal':'Pantalla completa'}</button>`);
};
const legacyActLocal=act;
act=function(action,target){
 const t=state.tables.find(x=>x.id===state.selectedTable);
 switch(action){
 case 'focus-panel':{
   panelFocusMode=!panelFocusMode;
   document.body.classList.toggle('fullview',panelFocusMode);
   if(panelFocusMode && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(()=>{});
   if(!panelFocusMode && document.fullscreenElement && document.exitFullscreen)document.exitFullscreen().catch(()=>{});
   render();return;
 }
 case 'upload-floorplan':document.getElementById('floor-image')?.click();return;
 case 'clear-floorplan':if(confirm('¿Quitar el croquis? Las mesas conservarán sus ubicaciones.')){state.floorplan=null;render();}return;
 case 'toggle-layout':state.layoutEdit=!state.layoutEdit;render();return;
 case 'add-local-table':{
   let n=1;while(state.tables.some(x=>x.id===`M${n}`))n++;
   const id=`M${n}`;state.tables.push({id,capacity:4,status:'free',shape:'round',x:50,y:50});state.selectedTable=id;state.layoutEdit=true;render();toast('Mesa agregada: tocá el plano para ubicarla');return;
 }
 case 'remove-local-table':{
   if(!t||state.tables.length<=1)return toast('Debe existir al menos una mesa');
   if(state.orders.some(o=>o.table===t.id&&o.status!=='delivered'&&o.status!=='cancelled'))return toast('La mesa tiene pedidos activos');
   if(!confirm(`¿Eliminar ${t.id} del plano?`))return;
   state.tables=state.tables.filter(x=>x!==t);state.selectedTable=state.tables[0].id;render();return;
 }
 case 'save-local-table':{
   if(!t)return;
   const id=document.getElementById('table-edit-name')?.value.trim().toUpperCase();
   const capacity=Number(document.getElementById('table-edit-capacity')?.value);
   const shape=document.getElementById('table-edit-shape')?.value;
   if(!id||id.length>12||!/^[A-Z0-9-]+$/.test(id))return toast('Número: hasta 12 letras, cifras o guiones');
   if(state.tables.some(x=>x!==t&&x.id===id))return toast('Ese número de mesa ya existe');
   if(!Number.isInteger(capacity)||capacity<1||capacity>16)return toast('Capacidad válida: 1 a 16');
   const old=t.id;t.id=id;t.capacity=capacity;t.shape=shape==='square'?'square':'round';
   state.orders.forEach(o=>{if(o.table===old)o.table=id;});state.selectedTable=id;render();toast('Mesa actualizada');return;
 }
 default:return legacyActLocal(action,target);
 }
};
const renderOldTables=tables;
tables=function(){
 makeSureTableLocations();
 const t=state.tables.find(x=>x.id===state.selectedTable)||state.tables[0];
 const status=x=>x.status==='free'?'Libre':x.status==='occupied'?'Ocupada':'Reservada';
 const btnHtml=state.tables.map(x=>{
   const seats=Array.from({length:Math.max(2,Math.min(x.capacity,6))},(_,i)=>`<span class="seat s${i+1}" aria-hidden="true"></span>`).join('');
   return `<button type="button" class="floor-table ${x.shape==='square'?'square':'round'} ${x.status} ${t.id===x.id?'selected':''}" style="left:${Math.max(6,Math.min(94,x.x))}%;top:${Math.max(10,Math.min(90,x.y))}%" data-action="select-table" data-id="${esc(x.id)}" aria-label="${esc(x.id)}, ${status(x)}, ${x.capacity} personas" title="${esc(x.id)} · ${status(x)}">${seats}<span class="table-core"><strong>${esc(x.id)}</strong><small>${x.capacity} pers.</small></span></button>`;
 }).join('');
 const selectedOrders=state.orders.filter(o=>o.table===t.id&&o.status!=='cancelled');
 return head('Mesas','Diseñá tu salón con mesas reales y colocá cada una sobre el croquis.',btn('Nueva orden en caja','navigate','data-to="pos"','btn btn-primary'))+
 `<div class="split split-wide"><section class="card"><div class="label-line"><h2 class="card-title">Distribución del local</h2><span class="pill">${state.tables.length} mesas</span></div>
 <div class="floor-toolbar"><button class="btn btn-subtle" data-action="upload-floorplan">▧ Subir croquis</button><button class="btn ${state.layoutEdit?'is-active':'btn-subtle'}" data-action="toggle-layout">${state.layoutEdit?'✓ Terminar ubicación':'⌖ Ubicar mesas'}</button><button class="btn btn-subtle" data-action="add-local-table">+ Agregar mesa</button>${state.floorplan?'<button class="btn btn-subtle" data-action="clear-floorplan">Quitar croquis</button>':''}</div>
 <input class="floor-plan-input" id="floor-image" type="file" accept="image/png,image/jpeg,image/webp" aria-label="Subir croquis del comedor">
 <div class="floor-scroll"><div class="floor-stage ${state.floorplan?'has-plan':''} ${state.layoutEdit?'is-editing':''}" id="floor-stage" style="${state.floorplan?'background-image:linear-gradient(#081a2799,#081a2766),url('+state.floorplan+')':''}"><span class="floor-grid"></span>${btnHtml}</div></div>
 <p class="floor-hint">${state.layoutEdit?'📍 Seleccioná una mesa y tocá el punto exacto del plano donde debe aparecer.':'Cada círculo representa una mesa con sus sillas. Podés cargar una imagen de tu comedor (croquis o plano) y ubicar las mesas.'} El diseño se guarda solo en este dispositivo.</p>
 <div class="filters"><span class="pill green">● Libres: ${state.tables.filter(x=>x.status==='free').length}</span><span class="pill red">● Ocupadas: ${state.tables.filter(x=>x.status==='occupied').length}</span><span class="pill blue">● Reservadas: ${state.tables.filter(x=>x.status==='reserved').length}</span></div></section>
 <section class="card"><h2 class="card-title">${esc(t.id)} · ${status(t)}</h2><p class="muted">${t.capacity} personas · ${t.shape==='square'?'Mesa rectangular':'Mesa redonda'}</p><div class="divider"></div>
 <div class="floor-edit-fields"><label class="field">Número<input id="table-edit-name" class="input" maxlength="12" value="${esc(t.id)}" /></label><label class="field">Personas<input id="table-edit-capacity" class="input" type="number" min="1" max="16" value="${t.capacity}" /></label><label class="field">Forma<select id="table-edit-shape"><option value="round" ${t.shape==='round'?'selected':''}>Redonda</option><option value="square" ${t.shape==='square'?'selected':''}>Rectangular</option></select></label></div>
 <div class="stack"><button class="btn btn-subtle" data-action="save-local-table">Guardar mesa</button><button class="btn btn-danger" data-action="remove-local-table">Eliminar mesa</button></div><div class="floor-separator"></div><h3 class="small">Cuenta de la mesa</h3>${selectedOrders.map(o=>`<div class="status-row"><span>${esc(o.id)} · ${statusName[o.status]}</span><strong>${price(total(o.items))}</strong></div>`).join('')||'<p class="muted small">Sin pedidos asociados.</p>'}
 <div class="divider"></div><div class="stack">${btn('Agregar pedido','table-order','','btn btn-primary')}${btn(t.status==='reserved'?'Liberar reserva':t.status==='free'?'Reservar':'Liberar mesa','toggle-table')}</div><p class="muted tiny">Croquis y operaciones de demostración: no se envían a ningún servidor.</p></section></div>`;
};
// Position the chosen table by tapping or clicking the floor while edit mode is active.
document.addEventListener('click',event=>{
 if(!state.layoutEdit||event.target.closest('.floor-table'))return;
 const stage=event.target.closest('.floor-stage');if(!stage)return;
 const t=state.tables.find(x=>x.id===state.selectedTable);if(!t)return;
 const r=stage.getBoundingClientRect();t.x=Math.max(6,Math.min(94,Math.round((event.clientX-r.left)*100/r.width*10)/10));t.y=Math.max(10,Math.min(90,Math.round((event.clientY-r.top)*100/r.height*10)/10));
 save();render();toast(`${t.id} ubicada en el croquis`);
 event.preventDefault();event.stopImmediatePropagation();
},true);
document.addEventListener('change',async event=>{
 if(event.target?.id!=='floor-image')return;
 const file=event.target.files?.[0];if(!file)return;
 if(!['image/png','image/jpeg','image/webp'].includes(file.type))return toast('Usá una imagen PNG, JPG o WebP');
 if(file.size>12*1024*1024)return toast('Máximo 12 MB por archivo');
 let tempUrl;
 try{
  tempUrl=URL.createObjectURL(file);
  const img=new Image();img.src=tempUrl;
  await img.decode();
  const scale=Math.min(1,1400/img.naturalWidth,1400/img.naturalHeight);const w=Math.round(img.naturalWidth*scale),h=Math.round(img.naturalHeight*scale);
  if(w<100||h<100)throw Error('croquis muy pequeño');
  const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;const ctx=canvas.getContext('2d');
  ctx.fillStyle='#ffffff';ctx.fillRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);
  let out=canvas.toDataURL('image/jpeg',.78);
  if(out.length>1100000)out=canvas.toDataURL('image/jpeg',.54);
  if(out.length>1600000)throw Error('croquis demasiado grande');
  const old=state.floorplan;state.floorplan=out;
  try{localStorage.setItem(STORE,JSON.stringify(state));render();toast('Croquis cargado y guardado en este dispositivo');}
  catch(e){state.floorplan=old;render();toast('Almacenamiento lleno: probá con una imagen más pequeña');}
 }catch(e){toast('No se pudo abrir el croquis: '+String(e.message||e).slice(0,48));}
 finally{if(tempUrl)URL.revokeObjectURL(tempUrl);}
});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&panelFocusMode&&!document.fullscreenElement){panelFocusMode=false;render();}});
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&panelFocusMode){panelFocusMode=false;render();}});

render();

  </script>
</body>
</html>
